name: Desktop Check

# Packages the desktop app on each OS (as the release does, without publishing), starts the bundled
# server the way the app starts it (from another folder, with NODE_PATH on the shipped node_modules;
# on Linux also in a clean container without Node), then opens the packaged app and uses it
# (.github/scripts/desktop-smoke.sh): the window loads the UI from file://, a chat with Polpo gets
# the reply of a mock model, the main pages render. On Windows the same with the installer: built,
# installed silently, and the installed app opened and used.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'ui/electron/**'
      - 'ui/binaries/**'
      - 'ui/package.json'
      - 'ui/vite.config.ts'
      - 'ui/index.html'
      - 'src/cli/**'
      - 'src/core/version.ts'
      - 'src/server/**'
      - 'packages/server/src/**'
      - '.github/scripts/**'
      - 'packages/server/src/routes/health.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release.yml'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch:

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile

      - name: Build packages and server
        run: |
          pnpm --filter @polpo-ai/vault-crypto build
          pnpm --filter @polpo-ai/core build
          pnpm --filter @polpo-ai/drizzle build
          pnpm --filter @polpo-ai/server build
          pnpm --filter @polpo-ai/sdk build
          ./node_modules/.bin/tsc
          pnpm --filter @polpo-ai/react build

      # as the release: Electron loads the UI from file://
      - name: Build UI
        run: POLPO_ELECTRON=1 VITE_POLPO_API_URL=http://localhost:3890 pnpm exec vite build
        working-directory: ui

      - name: Build sidecar
        run: bash ui/binaries/build-sidecar.sh

      - name: Package (unpacked, unsigned)
        run: pnpm exec electron-builder --dir --publish never
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Start the packaged server
        run: |
          EXPECTED="$(node -p "require('./package.json').version")"
          SERVER="$(find ui/release -type f \( -name polpo-server -o -name polpo-server.exe \) | head -1)"
          test -n "$SERVER" || { echo "polpo-server not found in the package"; find ui/release -maxdepth 4; exit 1; }
          RESOURCES="$(cd "$(dirname "$SERVER")" && pwd)"
          SERVER="$RESOURCES/$(basename "$SERVER")"
          test -d "$RESOURCES/node_modules/playwright-core" && test -d "$RESOURCES/node_modules/sharp" \
            || { echo "node_modules missing next to the server"; ls -la "$RESOURCES"; exit 1; }
          NM="$RESOURCES/node_modules"
          if [[ "$RUNNER_OS" == "Windows" ]]; then NM="$(cygpath -w "$NM")"; fi
          WORK="$(mktemp -d)"
          cd "$WORK"
          NODE_PATH="$NM" "$SERVER" serve -p 3990 -d "$WORK" > server.log 2>&1 &
          for i in $(seq 1 60); do
            BODY="$(curl -sf http://127.0.0.1:3990/api/v1/health || true)"
            [[ -n "$BODY" ]] && break
            sleep 1
          done
          cat server.log
          echo "health: $BODY"
          echo "$BODY" | grep -q "\"version\":\"$EXPECTED\"" || { echo "expected version $EXPECTED"; exit 1; }

      # The Linux server again, in a clean container: no Node, nothing from the runner
      - name: Start the packaged server in a clean container
        if: matrix.platform == 'linux'
        run: |
          EXPECTED="$(node -p "require('./package.json').version")"
          RESOURCES="$(cd ui/release/linux-unpacked/resources && pwd)"
          docker run -d --name polpo --network host -v "$RESOURCES:/opt/polpo:ro" -e NODE_PATH=/opt/polpo/node_modules \
            debian:bookworm-slim sh -c 'mkdir -p /tmp/work && cd /tmp/work && exec /opt/polpo/polpo-server serve -p 3991 -d /tmp/work'
          for i in $(seq 1 60); do
            BODY="$(curl -sf http://127.0.0.1:3991/api/v1/health || true)"
            [[ -n "$BODY" ]] && break
            sleep 1
          done
          docker logs polpo
          echo "health: $BODY"
          echo "$BODY" | grep -q "\"version\":\"$EXPECTED\"" || { echo "expected version $EXPECTED"; exit 1; }

      # The packaged app itself (smoke test mode in ui/electron/main.mjs), used: the window loads the UI,
      # a chat with Polpo gets the reply of a mock model, the main pages render
      - name: Open and use the packaged app
        # the app gives up after 45 s on its own; this only stops a hung app (no `timeout` on macOS)
        timeout-minutes: 8
        run: |
          case "$RUNNER_OS" in
            Linux) APP="ui/release/linux-unpacked/ui"; RUN="xvfb-run -a" ;;
            Windows) APP="ui/release/win-unpacked/Polpo.exe"; RUN="" ;;
            macOS) APP="$(ls -d ui/release/mac*/Polpo.app | head -1)/Contents/MacOS/Polpo"; RUN="" ;;
          esac
          APP="$(cd "$(dirname "$APP")" && pwd)/$(basename "$APP")"
          bash .github/scripts/desktop-smoke.sh "$APP" "$RUN"

      # Windows as users get it: the installer, installed for the user, then the installed app used
      - name: Build the Windows installer
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win nsis --publish never
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install it
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $setup = Get-ChildItem ui/release -Filter "Polpo*Setup*.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer not found in ui/release" }
          Write-Host "Installing $($setup.Name)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Polpo.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Polpo.exe not found after installing" }
          Write-Host "Installed at $($installed.FullName)"
          Get-ChildItem (Join-Path $installed.DirectoryName "resources") | Select-Object Name
          "POLPO_INSTALLED=$($installed.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Open and use the installed app
        if: matrix.platform == 'win'
        timeout-minutes: 8
        run: bash .github/scripts/desktop-smoke.sh "$(cygpath -u "$POLPO_INSTALLED")"
